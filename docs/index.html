<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; connect-src *; img-src 'self' data: https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com"
    >
    <title>docsichat</title>

    <!-- Core Theme (pinned) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/themes/core.min.css">
    <!-- Red Hat theme (load after core; mode-safe brand vars only) -->
    <link rel="stylesheet" href="rh-theme.css">
    <!-- Dark mode addon (auto: applies when the OS prefers dark; id used by the manual toggle) -->
    <link id="dark-addon" rel="stylesheet" media="(prefers-color-scheme: dark)" href="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/themes/addons/core-dark.min.css">
    <!-- docsichat: settings form + masked key styles -->
    <link rel="stylesheet" href="api-config.css">
    <style>
      #docsichat-theme-toggle {
        position: fixed;
        bottom: 18px;
        right: 18px;
        z-index: 999;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 1px solid #d2d2d2;
        background: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        line-height: 1;
        color: #151515;
      }
      #docsichat-theme-toggle:hover {
        border-color: #0066cc;
      }
      #docsichat-theme-toggle:focus-visible {
        outline: 3px solid #0066cc;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body class="loading">
    <div id="app"></div>

    <button
      id="docsichat-theme-toggle"
      type="button"
      aria-label="Toggle color theme"
      title="Theme: OS"
    >☀️</button>

    <style>
      /* Manual dark-mode toggle: applied by the script below when the user chooses light/dark. */
      [data-theme-forced="light"] body {
        background-color: #fff;
        color: #333;
      }
    </style>

    <!-- Configuration -->
    <script>
      window.$docsify = {
        name: 'docsichat',
        loadSidebar: true,
        subMaxLevel: 2,
        notFoundPage: true,
      };
    </script>

    <!-- Manual theme toggle (ES5): cycles OS → light → dark, persisted in localStorage. -->
    <script>
      (function () {
        var KEY = 'docsichat:api:ui:theme';
        var link = document.getElementById('dark-addon');
        var btn = document.getElementById('docsichat-theme-toggle');

        function readStored() {
          try {
            return window.localStorage.getItem(KEY);
          } catch (e) {
            return null;
          }
        }

        function writeStored(v) {
          try {
            window.localStorage.setItem(KEY, v);
          } catch (e) {
            /* private mode — ignore */
          }
        }

        function current() {
          var v = readStored();
          if (v === 'light' || v === 'dark') {
            return v;
          }
          return 'os';
        }

        function apply() {
          var t = current();
          if (t === 'dark') {
            link.setAttribute('media', 'all');
          } else if (t === 'light') {
            link.setAttribute('media', 'no-preference');
          } else {
            link.setAttribute('media', '(prefers-color-scheme: dark)');
          }
          document.documentElement.setAttribute('data-theme-forced', t);
          var label = 'Toggle color theme: currently ' +
            (t === 'dark' ? 'dark' : t === 'light' ? 'light' : 'OS default');
          btn.setAttribute('aria-label', label);
          btn.setAttribute('title', 'Theme: ' + (t === 'dark' ? 'Dark' : t === 'light' ? 'Light' : 'OS'));
          btn.textContent = t === 'dark' ? '🌙' : t === 'light' ? '☀️' : '🖥️';
        }

        function cycle() {
          var t = current();
          var next = t === 'os' ? 'light' : t === 'light' ? 'dark' : 'os';
          writeStored(next);
          apply();
        }

        btn.addEventListener('click', cycle);
        apply();
      })();
    </script>

    <!-- Docsify.js (pinned) -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@5.0.0"></script>

    <!-- Plugins (optional, pinned) -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/plugins/search.min.js"></script>
    <!-- docsichat plugin: registers itself into window.$docsify.plugins -->
    <script src="api-config.js"></script>
  </body>
</html>
