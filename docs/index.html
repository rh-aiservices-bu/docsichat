<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>docsichat</title>

    <!-- Core Theme -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
    <!-- Red Hat theme (load after core; mode-safe brand vars only) -->
    <link rel="stylesheet" href="rh-theme.css">
    <!-- Dark mode addon (auto: applies when the OS prefers dark) -->
    <link rel="stylesheet" media="(prefers-color-scheme: dark)" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/core-dark.min.css">
    <!-- docsichat: settings form + masked key styles -->
    <link rel="stylesheet" href="api-config.css">
  </head>
  <body class="loading">
    <div id="app"></div>

    <!-- Configuration -->
    <script>
      window.$docsify = {
        name: 'docsichat',
        loadSidebar: true,
        subMaxLevel: 2,
      };
    </script>

    <!-- Docsify.js -->
    <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>

    <!-- Plugins (optional) -->
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
    <!-- docsichat plugin: registers itself into window.$docsify.plugins -->
    <script src="api-config.js"></script>
  </body>
</html>
